spring.application.name=employee-onboarding-backend
server.port=8095

# Secrets are never stored here. They are read from the .env file in the
# repository root (copy .env.example to .env). The same values are given to the
# Camunda Connectors runtime as environment variables.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
mock.iam.token=${IAM_API_TOKEN}
mock.bgv.api-key=${BGV_API_KEY}
mock.slack.token=${SLACK_BOT_TOKEN}
